# docker-compose.yml
# Run everything locally with: docker-compose up --build
# All services start with a single command

version: "3.9"

services:

  # ── Node.js API ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai_service:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
    depends_on:
      - redis
    volumes:
      - ./src:/app/src   # hot reload in dev
    restart: unless-stopped

  # ── FastAPI AI Microservice ────────────────────────────────────
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile.ai
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
    depends_on:
      - redis
    volumes:
      - ai_models:/root/.cache/huggingface  # cache downloaded models
    restart: unless-stopped

  # ── Redis (local dev — Upstash in production) ──────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  ai_models:  # keeps the 22MB model after first download
